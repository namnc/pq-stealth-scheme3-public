[profile.default]
src = "src"
out = "out"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# THE THREE SETTINGS ABOVE ARE LOAD-BEARING, and `harness/announcement/measure.py` asserts
# what the build ACTUALLY used rather than trusting this file -- a different solc on PATH or
# a profile override would otherwise reprice every execution figure in silence.
#
# The reason this file can do that and `harness/registration` cannot: the ERC-6538 registry is
# measured as the DEPLOYED bytecode read off mainnet, so no compiler setting reaches it. The
# announcer is measured as a LOCAL BUILD, so every one of them does. The harness's docstring
# carries what the optimizer alone is worth, measured rather than guessed, and the receipt
# names the toolchain beside the hardfork.

# One contract, no libraries, no tests -- and no `test` key either, since there is no test
# directory to point it at and `test` is forge's default in any case.
#
# This directory exists for exactly one reason: `harness/announcement/measure.py` measures
# announcement cost as REAL standalone transactions against the real ERC-5564 interface, and
# that needs the announcer's bytecode. Measuring against a bespoke contract would measure the
# bespoke contract.
#
# There is deliberately no Foundry test here. The upstream repository has one that re-derives
# the committed receipts from the EIP-7623 rule, and it belongs beside the measurement rather
# than in this tree: a `gasleft()` measurement taken inside a test frame is the defect the
# harness's own docstring is about -- a test contract reaches the announcer with `CALL` and pays
# EIP-2929 cold access, which a standalone transaction does not, and that error was ~2.1x on
# execution gas and landed entirely on the denominator of every published ratio.
